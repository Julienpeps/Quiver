name: build-images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
            dockerfile: images/base/Dockerfile.amd64
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
            dockerfile: images/base/Dockerfile.arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build base image
        run: |
          docker build --file "${{ matrix.dockerfile }}" \
            --tag "quiver-base:${{ matrix.architecture }}" .
      - name: Build and smoke-test profile images
        env:
          BASE_IMAGE: "quiver-base:${{ matrix.architecture }}"
        run: |
          for profile in web internal cloud full; do
            required="$(uv run python -c "from quiver.core.images import load_package_report; print(' '.join(load_package_report('$profile', '${{ matrix.platform }}').required))")"
            optional="$(uv run python -c "from quiver.core.images import load_package_report; print(' '.join(load_package_report('$profile', '${{ matrix.platform }}').optional))")"
            docker build --file "images/profiles/$profile/Dockerfile" \
              --build-arg "BASE_IMAGE=$BASE_IMAGE" \
              --build-arg "REQUIRED_PACKAGES=$required" \
              --build-arg "OPTIONAL_PACKAGES=$optional" \
              --tag "quiver-$profile:${{ matrix.architecture }}" . \
              | tee "/tmp/quiver-build-$profile.log"
            if grep -q "Skipping unavailable optional package" "/tmp/quiver-build-$profile.log"; then
              grep "Skipping unavailable optional package" "/tmp/quiver-build-$profile.log" >> "$GITHUB_STEP_SUMMARY" || true
            fi
            docker run --rm "quiver-$profile:${{ matrix.architecture }}" \
              test -x /usr/local/bin/quiver-entrypoint \
                && test -x /usr/local/bin/quiver-record-shell \
                && test -f /etc/supervisor/supervisord.conf \
                && test -f "/etc/quiver/packages/$profile.yaml"
          done
          uv run python - <<'PY'
          from quiver.core.images import load_package_report

          platform = "${{ matrix.platform }}"
          for profile in ("web", "internal", "cloud", "full"):
              report = load_package_report(profile, platform)
              skipped = ", ".join(report.optional) or "(none)"
              print(f"[{profile}] architecture-optional packages (build-skipped if unavailable): {skipped}")
          PY
