name: release-images

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: Fully-qualified target repository, e.g. ghcr.io/owner/quiver
        required: true
        type: string
      version:
        description: Immutable release version, e.g. v0.1.0
        required: true
        type: string
      date_tag:
        description: Date/build tag, e.g. 2026.09.20
        required: true
        type: string
      blackarch_strap_url:
        description: Immutable BlackArch strap script URL
        required: true
        type: string
      blackarch_strap_sha256:
        description: SHA-256 of that BlackArch strap script
        required: true
        type: string
      archlinuxarm_rootfs_url:
        description: Immutable Arch Linux ARM aarch64 rootfs URL
        required: true
        type: string
      archlinuxarm_rootfs_sha256:
        description: SHA-256 of that ARM rootfs
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  provenance-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require immutable provenance inputs
        env:
          STRAP_URL: ${{ inputs.blackarch_strap_url }}
          STRAP_SHA: ${{ inputs.blackarch_strap_sha256 }}
          ROOTFS_URL: ${{ inputs.archlinuxarm_rootfs_url }}
          ROOTFS_SHA: ${{ inputs.archlinuxarm_rootfs_sha256 }}
        run: |
          test -n "$STRAP_URL" && test -n "$STRAP_SHA" && test -n "$ROOTFS_URL" && test -n "$ROOTFS_SHA"
          test "${#STRAP_SHA}" = 64 && test "${#ROOTFS_SHA}" = 64
  publish:
    needs: provenance-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
            dockerfile: images/base/Dockerfile.amd64
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
            dockerfile: images/base/Dockerfile.arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and publish profile images
        env:
          IMAGE: ${{ inputs.image_repository }}
          VERSION: ${{ inputs.version }}
          DATE_TAG: ${{ inputs.date_tag }}
          BLACKARCH_STRAP_URL: ${{ inputs.blackarch_strap_url }}
          BLACKARCH_STRAP_SHA256: ${{ inputs.blackarch_strap_sha256 }}
          ROOTFS_URL: ${{ inputs.archlinuxarm_rootfs_url }}
          ROOTFS_SHA256: ${{ inputs.archlinuxarm_rootfs_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.platform }}" = linux/arm64 ]; then
            curl --fail --location --retry 3 "$ROOTFS_URL" --output images/base/rootfs/archlinuxarm-aarch64.tar.gz
            echo "$ROOTFS_SHA256  images/base/rootfs/archlinuxarm-aarch64.tar.gz" | sha256sum --check --status
          fi
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          architecture="${{ matrix.architecture }}"
          docker build --file "${{ matrix.dockerfile }}" \
            --build-arg "BLACKARCH_STRAP_URL=$BLACKARCH_STRAP_URL" \
            --build-arg "BLACKARCH_STRAP_SHA256=$BLACKARCH_STRAP_SHA256" \
            --build-arg "ARCHLINUXARM_ROOTFS_SHA256=$ROOTFS_SHA256" \
            --tag "$IMAGE-base:${VERSION}-${architecture}" .
          docker push "$IMAGE-base:${VERSION}-${architecture}"
          for profile in web internal full; do
            docker build --file "images/profiles/$profile/Dockerfile" \
              --build-arg "BASE_IMAGE=$IMAGE-base:${VERSION}-${architecture}" \
              --build-arg "REQUIRED_PACKAGES=$(uv run python -c 'from quiver.core.images import load_package_report; print(" ".join(load_package_report("$profile", "${{ matrix.platform }}").required))')" \
              --build-arg "OPTIONAL_PACKAGES=$(uv run python -c 'from quiver.core.images import load_package_report; print(" ".join(load_package_report("$profile", "${{ matrix.platform }}").optional))')" \
              --tag "$IMAGE-$profile:${VERSION}-${architecture}" .
            docker push "$IMAGE-$profile:${VERSION}-${architecture}"
          done
  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Publish multi-platform manifests for every profile
        env:
          IMAGE: ${{ inputs.image_repository }}
          VERSION: ${{ inputs.version }}
          DATE_TAG: ${{ inputs.date_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for profile in base web internal full; do
            docker buildx imagetools create \
              --tag "$IMAGE-$profile:$VERSION" \
              --tag "$IMAGE-$profile:$DATE_TAG" \
              --tag "$IMAGE-$profile:stable" \
              "$IMAGE-$profile:${VERSION}-amd64" "$IMAGE-$profile:${VERSION}-arm64"
          done
