name: release-images

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: Fully-qualified target repository, e.g. ghcr.io/owner/quiver
        required: true
        type: string
      version:
        description: Immutable release version, e.g. v0.1.0
        required: true
        type: string
      date_tag:
        description: Date/build tag, e.g. 2026.09.20
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
            dockerfile: images/base/Dockerfile.amd64
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
            dockerfile: images/base/Dockerfile.arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and publish profile images
        env:
          IMAGE: ${{ inputs.image_repository }}
          VERSION: ${{ inputs.version }}
          DATE_TAG: ${{ inputs.date_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          architecture="${{ matrix.architecture }}"
          docker build --file "${{ matrix.dockerfile }}" \
            --tag "$IMAGE-base:${VERSION}-${architecture}" .
          docker push "$IMAGE-base:${VERSION}-${architecture}"
          for profile in web internal external cloud full; do
            required="$(uv run python -c "from quiver.core.images import load_package_report; print(' '.join(load_package_report('$profile', '${{ matrix.platform }}').required))")"
            optional="$(uv run python -c "from quiver.core.images import load_package_report; print(' '.join(load_package_report('$profile', '${{ matrix.platform }}').optional))")"
            docker build --file "images/profiles/$profile/Dockerfile" \
              --build-arg "BASE_IMAGE=$IMAGE-base:${VERSION}-${architecture}" \
              --build-arg "REQUIRED_PACKAGES=$required" \
              --build-arg "OPTIONAL_PACKAGES=$optional" \
              --tag "$IMAGE-$profile:${VERSION}-${architecture}" .
            docker push "$IMAGE-$profile:${VERSION}-${architecture}"
          done
  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Publish multi-platform manifests for every profile
        env:
          IMAGE: ${{ inputs.image_repository }}
          VERSION: ${{ inputs.version }}
          DATE_TAG: ${{ inputs.date_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for profile in base web internal external cloud full; do
            docker buildx imagetools create \
              --tag "$IMAGE-$profile:$VERSION" \
              --tag "$IMAGE-$profile:$DATE_TAG" \
              --tag "$IMAGE-$profile:stable" \
              "$IMAGE-$profile:${VERSION}-amd64" "$IMAGE-$profile:${VERSION}-arm64"
          done
