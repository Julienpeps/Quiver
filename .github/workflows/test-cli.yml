name: test-cli

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.15
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Run unit tests
        env:
          COLUMNS: "200"
        run: |
          set +e
          uv run pytest tests/unit > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 20 /tmp/pytest.log | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")')"
            echo "::error title=Unit tests failed::$message"
            exit "$status"
          fi
      - name: Lint
        run: uv run ruff check .
      - name: Smoke-test CLI
        run: uv run quiver --help
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.15
      - name: Run Docker lifecycle integration tests
        run: |
          uv sync --all-groups --frozen
          uv run pytest tests/integration
