[project]
name = "quiver"
version = "0.1.0"
description = "Disposable assessment-scoped penetration-testing environments"
requires-python = ">=3.12"
dependencies = [
    "filelock>=4.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
quiver = "quiver:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Docker daemon with Linux containers",
]

[tool.ruff]
target-version = "py312"
